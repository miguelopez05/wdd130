<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Provide to the user a way to contact the Splash White Waters Rafting team">
    <meta name="author" content="Miguel Lopez">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Splash White Waters Rafting</title>
</head>


<body>

    <header class="grid-container">
        <img src="images/splash-logo.png" alt="A logo of Rafting">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1>Splash White Waters Rafting </h1>
            <div class="contacts">
                <p>123 Main River Street</p>
                <p>Manaus, Brazil</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>

            <div class="main-content">
                <div class="map">

                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3350.002930829582!2d-59.94045944773591!3d-3.135008861349577!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x926c048737dc2323%3A0x4703c7374f577431!2sPorto%20da%20Ceasa!5e0!3m2!1sen!2sbr!4v1780795893897!5m2!1sen!2sbr"
                      width="400" height="300" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"></iframe>

                </div>

                <form>
                    <div class="form-item">
                        <label for="name">Name </label>
                        <input type="text" name="name" id="name" placeholder="placeholder">
                    </div>
                    <div class="form-item">
                        <label for="email">Email </label>
                        <input type="text" name="email" id="email" placeholder="placeholder">
                    </div>
                    <div class="form-item">
                        <span class="form-radio">Message Purpose</span>
                        <div class="radio-options">
                            <label>
                                <input type="radio" id="general" name="message_purpose"
                                  value="general">
                                General
                                Inquiry
                            </label>
                            <label>
                                <input type="radio" id="reservation" name="message_purpose"
                                  value="reservation">
                                Reservation
                            </label>
                            <label>
                                <input type="radio" id="suggestion" name="message_purpose"
                                  value="suggestion">
                                Website
                                Suggestion
                            </label>
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="textbox">Message:</label>
                        <textarea id="textbox" name="textbox" rows="4"
                          placeholder="Type here"></textarea>
                    </div>
                    <div class="form-item-check">
                        <div></div> <label for="sub">
                            <input type="checkbox" id="sub" name="sub"> Please subscribe me to the
                            monthly
                            newsletter
                        </label>
                    </div>
                    <div class="form-button">
                        <div></div><button type="Get in Touch">Get in Touch!</button>
                    </div>
                </form>
            </div>
            <section>
                <h2>We Are Here to Serve You</h2>
                <div class="adventure-grid">
                    <figure>
                        <img src="images/chri.jpg" alt="Brown River">
                        <figcaption>Chris</figcaption>
                    </figure>

                    <figure>
                        <img src="images/patric.jpg" width="250" height="350" alt="Buena Vista">
                        <figcaption>Patrick</figcaption>
                    </figure>

                    <figure>
                        <img src="images/jake.jpg" alt="Cleark Creek">
                        <figcaption>Jake</figcaption>
                    </figure>

                </div>
            </section>
        </div>
    </main>


    <footer>
        <p>© 2026 Splash White Water Rafting, Miguel Lopez </p>
        <nav class="socialmedia">
            <a href="https://Facebook.com">
                <img src="images/facebook-square.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.png" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.png" alt="instagram Icon">
            </a>

        </nav>

    </footer>

</body>

</html>
